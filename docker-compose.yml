version: '3.8'
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "rs.status()", "--quiet"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mongo-data:
